<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyrics overlay settings</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/settings.css">
<script type="module" src="/settings.js"></script>
</head>
<body>
<header id="topbar"></header>
<p id="banner" role="status" hidden></p>
<div id="shell">
  <aside id="stage" aria-label="Live preview"></aside>
  <section id="inspector" aria-label="Settings">
    <nav id="tabs" role="tablist" aria-label="Settings sections"></nav>
    <main id="workspace"></main>
  </section>
</div>
<div id="lyrics-modal-backdrop" class="modal-backdrop" hidden></div>
</body>
</html>
